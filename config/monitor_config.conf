# Monitoring Configuration File (source this file in your bashrc or other env files)
# SSH Dashboard Monitor Configuration
# System Monitoring Settings
MONITOR_INTERVAL=60
CPU_THRESHOLD=90
MEMORY_THRESHOLD=85
DISK_THRESHOLD=85
TEMP_THRESHOLD=80
PING_INTERVAL=30
NETWORK_RETRY_COUNT=3

# Directory Settings
LOG_DIR=var/log
DATA_DIR=var/data
TEMP_DIR=var/tmp

# Retry Settings
MAX_RETRIES=3
RETRY_DELAY=5
ALERT_THRESHOLD=90

# Backup Settings
BACKUP_ENABLED=true
BACKUP_INTERVAL=86400
BACKUP_RETENTION=5