# Example Service Configuration

# Service Settings
service:
  name: "ssh-dashboard"
  description: "SSH Dashboard Monitor Service"
  version: "1.0.0"

# Component Settings
components:
  ha:
    enabled: true
    mode: "primary"
    sync_interval: 300
    peer:
      host: "secondary.example.com"
      port: 873
      user: "rsync"
      key: "/root/.ssh/ha_key"

  monitoring:
    enabled: true
    interval: 60
    retention: 604800
    thresholds:
      cpu: 80
      memory: 80
      disk: 90

  security:
    enabled: true
    ssh_config: "/etc/ssh/sshd_config"
    key_types:
      - "rsa"
      - "ed25519"
    min_key_size: 3072
    max_auth_tries: 3

# Web Interface
web:
  enabled: true
  port: 3000
  host: "localhost"
  ssl:
    enabled: true
    cert: "/etc/ssl/certs/dashboard.crt"
    key: "/etc/ssl/private/dashboard.key"

# Logging
logging:
  level: "info"
  file: "${HA_LOG_DIR}/service.log"
  max_size: 10485760
  max_files: 5
  format: "json"

# Notifications
notifications:
  email:
    enabled: false
    smtp:
      host: "smtp.example.com"
      port: 587
      user: "alerts@example.com"
      password: "password"
    recipients:
      - "admin@example.com"
  slack:
    enabled: false
    webhook: "https://hooks.slack.com/services/xxx/yyy/zzz"
    channel: "#alerts"

# Resource Limits
resources:
  cpu:
    limit: 2
    reservation: 1
  memory:
    limit: "4G"
    reservation: "2G"
  disk:
    limit: "20G"
    reservation: "10G"

# Dependencies
dependencies:
  required:
    - "openssh-server"
    - "rsync"
    - "nodejs"
  optional:
    - "prometheus-node-exporter"
    - "filebeat"

# Security
security:
  firewall:
    enabled: true
    allow:
      - port: 22
        protocol: "tcp"
        source: "any"
      - port: 3000
        protocol: "tcp"
        source: "localhost"
      - port: 873
        protocol: "tcp"
        source: "secondary.example.com"
  selinux:
    enabled: true
    type: "ssh_dashboard_t"
    context: "system_u:system_r:ssh_dashboard_t:s0"
