# SSH Dashboard Monitor - Main Configuration
# This is the primary configuration file for the SSH Dashboard Monitor system

#######################
# Core Configuration #
#######################

# Environment
ENV="production"                  # Options: development, production, testing
DEBUG=false                       # Enable debug mode
TEST_MODE=false                  # Enable test mode

# Base Paths
BASE_DIR="${ROOT_DIR}"
CONFIG_DIR="${BASE_DIR}/config"
LOG_DIR="${BASE_DIR}/var/log"
TEMP_DIR="${BASE_DIR}/var/tmp"
BACKUP_DIR="${BASE_DIR}/var/backups"

# Logging
LOG_LEVEL="INFO"                 # Options: DEBUG, INFO, WARNING, ERROR
MAX_LOG_SIZE="10M"              # Maximum size for log files
LOG_RETENTION_DAYS=30           # Days to keep logs
COMPRESS_LOGS=true              # Compress rotated logs

######################
# SSH Configuration #
######################

# Connection Settings
SSH_HOST="remote-system"         # Remote host address
SSH_USER="lj"                    # SSH username
SSH_PORT=22                      # SSH port
SSH_KEY_TYPE="ed25519"          # Key type: rsa, ed25519
SSH_KEY_BITS=4096               # Key size in bits
SSH_KEY_DIR="${HOME}/.ssh"      # SSH key directory
SSH_TIMEOUT=30                  # Connection timeout in seconds

# Port Forwarding
ENABLE_PORT_FORWARDING=true     # Enable automatic port forwarding
DASHBOARD_PORT=8080             # Dashboard web interface port
METRICS_PORT=9090              # Metrics endpoint port
REMOTE_COMMAND_PORT=2222       # Remote command execution port

########################
# Sync Configuration #
########################

# File Sync Settings
SYNC_ENABLED=true               # Enable file synchronization
SYNC_INTERVAL=300              # Sync interval in seconds
SYNC_RETRY_COUNT=3             # Number of retries for failed syncs
SYNC_RETRY_DELAY=5             # Delay between retries in seconds

# Sync Paths
LOCAL_SYNC_DIR="${BASE_DIR}/var/data"
REMOTE_SYNC_DIR="/home/${SSH_USER}/ssh_dashboard_monitor/var/data"
SYNC_EXCLUDE="*.tmp,*.log,*.pid"  # Files to exclude from sync

# Lock Files
SYNC_LOCK_FILE="/var/lock/sync_service.lock"
MONITOR_LOCK_FILE="/var/lock/monitor_service.lock"

#########################
# Monitor Configuration #
#########################

# System Monitoring
MONITOR_ENABLED=true            # Enable system monitoring
MONITOR_INTERVAL=60            # Check interval in seconds
MONITOR_RETENTION_DAYS=14      # Days to keep monitoring data

# Resource Thresholds
CPU_THRESHOLD=90               # CPU usage alert threshold (%)
MEMORY_THRESHOLD=85           # Memory usage alert threshold (%)
DISK_THRESHOLD=85            # Disk usage alert threshold (%)
TEMP_THRESHOLD=80           # Temperature threshold (°C)

# Network Monitoring
PING_INTERVAL=30              # Ping interval in seconds
PING_TIMEOUT=5               # Ping timeout in seconds
NETWORK_RETRY_COUNT=3        # Network retry attempts

#########################
# Recovery Configuration #
#########################

# Backup Settings
BACKUP_ENABLED=true            # Enable automatic backups
BACKUP_INTERVAL=86400         # Backup interval (24 hours)
BACKUP_RETENTION=5            # Number of backups to keep
COMPRESS_BACKUPS=true         # Compress backup files

# Recovery Options
AUTO_RECOVERY=true            # Enable automatic recovery
MAX_RECOVERY_ATTEMPTS=3       # Maximum recovery attempts
RECOVERY_WAIT_TIME=300       # Wait time between recovery attempts

#########################
# Security Configuration #
#########################

# Access Control
REQUIRE_SUDO=true             # Require sudo for sensitive operations
CHECK_PERMISSIONS=true        # Verify file permissions
STRICT_MODE=true             # Enable additional security checks

# Authentication
AUTH_TIMEOUT=3600            # Authentication timeout (1 hour)
MAX_AUTH_ATTEMPTS=3          # Maximum authentication attempts
PASSWORD_MIN_LENGTH=12       # Minimum password length

########################
# GUI Configuration #
########################

# Web Interface
WEB_ENABLED=true             # Enable web interface
WEB_HOST="0.0.0.0"          # Web interface host
WEB_PORT=8080               # Web interface port
WEB_SSL=true               # Enable SSL/TLS
SSL_CERT="${CONFIG_DIR}/ssl/cert.pem"
SSL_KEY="${CONFIG_DIR}/ssl/key.pem"

# Dashboard Settings
REFRESH_INTERVAL=5           # Dashboard refresh interval (seconds)
MAX_GRAPH_POINTS=1000       # Maximum points in graphs
ENABLE_DARK_MODE=true       # Enable dark mode
ENABLE_NOTIFICATIONS=true   # Enable browser notifications

# API Settings
API_ENABLED=true            # Enable REST API
API_PORT=9090             # API port
API_TOKEN_EXPIRY=86400    # API token expiry (24 hours)
MAX_API_REQUESTS=1000     # Maximum API requests per hour
